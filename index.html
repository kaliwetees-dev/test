<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #555; }
        #drop-zone.dragover { border-color: #3b82f6; background-color: #eff6ff; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Header -->
        <header class="mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-gray-900"></h1>
                <p class="text-gray-500 text-sm">Offline-first SQLite Database Viewer</p>
            </div>
            <div id="db-stats" class="hidden text-right">
                <span id="file-name" class="block font-medium text-gray-700 uppercase tracking-wider text-xs"></span>
                <span id="file-size" class="text-gray-400 text-xs"></span>
            </div>
        </header>

        <!-- Drop Zone -->
        <div id="drop-zone" class="relative border-4 border-dashed border-gray-200 rounded-2xl p-12 text-center transition-all cursor-pointer bg-white shadow-sm hover:border-blue-400">
            <input type="file" id="file-input" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" accept=".sqlite3,.db,.sqlite">
            <div class="space-y-4">
                <div class="mx-auto w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center">
                    <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                </div>
                <div>
                    <p class="text-xl font-semibold">Drop your <code class="bg-gray-100 px-1 rounded">db.sqlite3</code> here</p>
                    <p class="text-gray-400 text-sm mt-1">Maximum performance, local processing.</p>
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div id="main-content" class="hidden mt-8 grid grid-cols-12 gap-6">
            
            <!-- Sidebar: Tables -->
            <div class="col-span-12 lg:col-span-3 space-y-4">
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                    <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">Tables</h2>
                    <nav id="table-list" class="space-y-1 max-h-[60vh] overflow-y-auto custom-scrollbar">
                        <!-- Table items injected here -->
                    </nav>
                </div>
            </div>

            <!-- Content: Data Table -->
            <div class="col-span-12 lg:col-span-9 space-y-4">
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                        <h3 id="current-table-name" class="font-bold text-gray-700">Select a table</h3>
                        <div class="flex items-center space-x-2">
                            <span id="row-count" class="text-xs font-medium bg-gray-200 text-gray-600 px-2 py-1 rounded-full"></span>
                        </div>
                    </div>
                    
                    <div class="overflow-x-auto custom-scrollbar">
                        <table class="w-full text-left border-collapse">
                            <thead id="table-head" class="bg-gray-50 text-xs uppercase font-bold text-gray-500 border-b border-gray-100">
                                <!-- Headers injected here -->
                            </thead>
                            <tbody id="table-body" class="text-sm text-gray-600 divide-y divide-gray-50">
                                <!-- Data injected here -->
                            </tbody>
                        </table>
                    </div>
                    <div id="loading-overlay" class="hidden p-8 text-center text-gray-400">
                        Loading large dataset...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let db = null;
        const config = {
            locateFile: filename => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.wasm`
        };

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const tableList = document.getElementById('table-list');
        const tableHead = document.getElementById('table-head');
        const tableBody = document.getElementById('table-body');
        const mainContent = document.getElementById('main-content');
        const currentTableName = document.getElementById('current-table-name');
        const rowCount = document.getElementById('row-count');

        // Drag and Drop Logic
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, e => {
                e.preventDefault();
                e.stopPropagation();
            }, false);
        });

        dropZone.addEventListener('dragover', () => dropZone.classList.add('dragover'));
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            dropZone.classList.remove('dragover');
            handleFile(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

        async function handleFile(file) {
            if (!file) return;

            // Update UI Stats
            document.getElementById('db-stats').classList.remove('hidden');
            document.getElementById('file-name').textContent = file.name;
            document.getElementById('file-size').textContent = (file.size / 1024 / 1024).toFixed(2) + ' MB';

            const SQL = await initSqlJs(config);
            const reader = new FileReader();
            
            reader.onload = function() {
                const Uints = new Uint8Array(reader.result);
                db = new SQL.Database(Uints);
                loadTableList();
                dropZone.classList.add('hidden');
                mainContent.classList.remove('hidden');
            };
            reader.readAsArrayBuffer(file);
        }

        function loadTableList() {
            const res = db.exec("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name ASC");
            tableList.innerHTML = '';
            
            if (res.length > 0) {
                res[0].values.forEach(row => {
                    const name = row[0];
                    const btn = document.createElement('button');
                    btn.className = "w-full text-left px-3 py-2 rounded-lg text-sm font-medium transition-colors hover:bg-blue-50 hover:text-blue-600 text-gray-600 mb-1 flex items-center justify-between group";
                    btn.innerHTML = `
                        <span>${name}</span>
                        <svg class="w-4 h-4 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    `;
                    btn.onclick = () => {
                        // Reset styles
                        Array.from(tableList.children).forEach(c => c.classList.remove('bg-blue-50', 'text-blue-600'));
                        btn.classList.add('bg-blue-50', 'text-blue-600');
                        viewTable(name);
                    };
                    tableList.appendChild(btn);
                });
                
                // Auto-load first table if exists
                if(tableList.firstChild) tableList.firstChild.click();
            }
        }

        function viewTable(name) {
            currentTableName.textContent = name;
            tableHead.innerHTML = '';
            tableBody.innerHTML = '';
            rowCount.textContent = "Loading...";

            // Use timeout to allow UI to update "Loading" state
            setTimeout(() => {
                try {
                    // Limit rows for browser performance, specifically for RETAIL_PRODUCT
                    const res = db.exec(`SELECT * FROM "${name}" LIMIT 500`);
                    const countRes = db.exec(`SELECT count(*) FROM "${name}"`);
                    
                    rowCount.textContent = `${countRes[0].values[0][0]} total rows`;

                    if (res.length > 0) {
                        const columns = res[0].columns;
                        const values = res[0].values;

                        // Build Head
                        let headHtml = '<tr>';
                        columns.forEach(col => {
                            headHtml += `<th class="px-4 py-3 border-b border-gray-100">${col}</th>`;
                        });
                        headHtml += '</tr>';
                        tableHead.innerHTML = headHtml;

                        // Build Body
                        let bodyHtml = '';
                        values.forEach(row => {
                            bodyHtml += `<tr class="hover:bg-gray-50 transition-colors">`;
                            row.forEach(val => {
                                bodyHtml += `<td class="px-4 py-3 border-b border-gray-50 truncate max-w-xs" title="${val}">${val === null ? '<span class="text-gray-300 italic">null</span>' : val}</td>`;
                            });
                            bodyHtml += `</tr>`;
                        });
                        tableBody.innerHTML = bodyHtml;

                        if(values.length === 500) {
                            const footer = document.createElement('tr');
                            footer.innerHTML = `<td colspan="${columns.length}" class="p-4 text-center text-gray-400 bg-gray-50 italic text-xs">Showing first 500 rows for performance.</td>`;
                            tableBody.appendChild(footer);
                        }
                    } else {
                        tableBody.innerHTML = '<tr><td class="p-8 text-center text-gray-400 italic">Table is empty</td></tr>';
                    }
                } catch (e) {
                    tableBody.innerHTML = `<tr><td class="p-8 text-center text-red-400">Error: ${e.message}</td></tr>`;
                }
            }, 50);
        }
    </script>
</body>
</html>
